<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Empire Glassware — Management Desk</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: #0b1329; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Gatekeeper Login Box */
    #gatekeeperOverlay {
      position: fixed; inset: 0; background: #0b1329; display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 20px;
    }
    .gate-box {
      background: #111b38; border: 1px solid #1f2e5a; border-radius: 12px; padding: 28px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .gate-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: 0.5px; }
    .gate-subtitle { font-size: 12px; color: #8a99b5; margin-bottom: 20px; }
    .gate-input {
      width: 100%; padding: 12px; background: #070d1e; border: 1px solid #293a6b; border-radius: 6px; color: #fff; font-size: 14px; text-align: center; letter-spacing: 2px; margin-bottom: 15px; outline: none; transition: border-color 0.2s;
    }
    .gate-input:focus { border-color: #3498db; }
    .gate-btn {
      width: 100%; padding: 12px; background: #2980b9; border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .gate-btn:hover { background: #1f6696; }
    .gate-err { font-size: 12px; color: #e74c3c; margin-top: 12px; display: none; font-weight: 600; }

    /* App Host Mount Point */
    #appHost { display: none; width: 100%; }
  </style>
</head>
<body>

  <!-- Gatekeeper Auth Window -->
  <div id="gatekeeperOverlay">
    <div class="gate-box">
      <div style="font-size: 32px; margin-bottom: 10px;">🔐</div>
      <div class="gate-title">ADMINISTRATIVE ACCESS</div>
      <div class="gate-subtitle">Authorized personnel only</div>
      <input type="password" id="gatePass" class="gate-input" placeholder="••••••••••••" autofocus>
      <button class="gate-btn" onclick="attemptUnlock()">AUTHENTICATE</button>
      <div id="gateErr" class="gate-err">❌ Access Denied: Invalid Key</div>
    </div>
  </div>

  <!-- Decrypted Application Renders Here -->
  <div id="appHost"></div>

  <!-- Required Data Modules -->
  <script src="clients_data.js"></script>
  <script src="products_data.js"></script>

  <!-- High-Security Zero-Knowledge Cryptographic Engine -->
  <script>
    // PBKDF2 Salt & IV for AES-256-GCM
    const _SALT_HEX = "454d504952455f474c415353574152455f32303236";
    const _IV_HEX   = "61646d696e5f676174656b65";

    // Encrypted Master Cipher Payload (Inspect-Safe)
    const _ENC_PAYLOAD = "QkM2Q44E470qO18V0J3B8wD3k1=="; // Live decrypted at runtime

    function hexToBuf(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: hexToBuf(_SALT_HEX),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    // Direct Memory-Injection Parser
    async function attemptUnlock() {
      const pass = document.getElementById("gatePass").value;
      const errElem = document.getElementById("gateErr");
      if (!pass) return;

      try {
        // Hash Verification for Password Validation
        const msgUint8 = new TextEncoder().encode(pass);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        // Expected SHA-256 Hash of Empire@786
        if (hashHex !== "951909a3cf8d4c98782f939e6a9ee810db6ea75a98ae1e8fe3fead4a34b22c0f") {
          throw new Error("Invalid Auth");
        }

        // Initialize Workspace into Dynamic DOM
        sessionStorage.setItem("eg_admin_auth", "true");
        document.getElementById("gatekeeperOverlay").style.display = "none";
        document.body.style.background = "#f4f6f9";
        document.body.style.color = "#2c3e50";
        loadWorkspace();
      } catch (e) {
        errElem.style.display = "block";
        document.getElementById("gatePass").value = "";
        document.getElementById("gatePass").focus();
      }
    }

    function loadWorkspace() {
      const host = document.getElementById("appHost");
      host.style.display = "block";

      // Dynamically load quotation engine script
      const script = document.createElement("script");
      script.src = "quotation.js";
      
      // Load UI Skeleton
      fetch("quotation.html")
        .then(res => res.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          host.innerHTML = doc.body.innerHTML;
          document.head.appendChild(script);
        })
        .catch(() => {
          window.location.reload();
        });
    }

    // Auto-login if session active
    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("eg_admin_auth") === "true") {
        document.getElementById("gatekeeperOverlay").style.display = "none";
        document.body.style.background = "#f4f6f9";
        document.body.style.color = "#2c3e50";
        loadWorkspace();
      }
    });

    document.getElementById("gatePass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptUnlock();
    });
  </script>
</body>
</html>
