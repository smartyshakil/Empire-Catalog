    <style>
        :root {
            --bg-main: #f8fafc;
            --primary-dark: #0f172a;
            --header-bg: #0b1329;
            --gold: #d97706;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); padding-bottom: 110px; color: #1e293b; }
        
        #iosInstallBanner {
            display: none;
            background: #1e293b;
            color: #f8fafc;
            padding: 10px 14px;
            font-size: 11.5px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: relative;
            z-index: 94;
        }

        .diwali-banner {
            background: linear-gradient(90deg, #0b1329 0%, #1e1b4b 50%, #0b1329 100%);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            padding: 7px 10px;
            border-bottom: 2px solid #f59e0b;
        }

        header { 
            background: var(--header-bg); 
            color: white; 
            padding: 10px 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
        }
        .header-title h1 { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: #ffffff; }
        .header-title p { font-size: 9.5px; color: #94a3b8; font-weight: 500; }
        
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .header-action-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .catalog-container {
            max-width: 1400px;
            margin: 12px auto;
            padding: 0 10px;
            display: flex;
            gap: 16px;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            height: fit-content;
            position: sticky;
            top: 65px;
        }
        .sidebar-header {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .cat-pill {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 5px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            color: #1e293b;
            font-size: 11.5px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cat-pill.active {
            background: var(--primary-dark);
            color: #ffffff;
            border-color: var(--primary-dark);
        }

        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

        .search-box input { 
            width: 100%; 
            padding: 9px 12px; 
            border-radius: 10px; 
            border: 1.5px solid var(--border-color); 
            outline: none; 
            font-size: 12.5px; 
            background: #ffffff; 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 12px; 
        }
        .card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 8px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: var(--card-shadow); 
        }
        .card-img-wrapper {
            background: #ffffff;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 140px;
            border: 1px solid #f1f5f9;
            position: relative;
        }
        .card img { 
            max-width: 100%; 
            height: 140px; 
            object-fit: contain; 
            border-radius: 6px; 
            cursor: pointer; 
        }

        .countdown-badge {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #b45309;
            font-size: 9.5px;
            font-weight: 700;
            text-align: center;
            padding: 4px 6px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .p-code { 
            font-weight: 700; 
            font-size: 12px; 
            color: #0369a1; 
            margin-top: 6px; 
        }

        .counter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 6px;
            margin-top: 6px;
        }
        .counter-label { font-size: 10.5px; font-weight: 700; color: #475569; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn {
            background: var(--primary-dark);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-val { font-size: 12px; font-weight: 700; color: #1e293b; min-width: 18px; text-align: center; }

        .floating-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
            z-index: 99;
        }
        .selection-info { font-size: 12px; font-weight: 700; color: var(--primary-dark); }
        .btn-send-bulk {
            background: #25D366;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        /* Lightbox Pinch Zoom Support Added */
        #lightboxModal img {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            touch-action: pinch-zoom;
        }

        @media (max-width: 768px) {
            .catalog-container { flex-direction: column; padding: 0 8px; }
            .sidebar { 
                width: 100%; 
                position: sticky; 
                top: 58px; 
                z-index: 85; 
                display: flex; 
                overflow-x: auto; 
                gap: 5px; 
                padding: 8px; 
                border-radius: 8px;
                white-space: nowrap;
                scrollbar-width: none;
            }
            .sidebar::-webkit-scrollbar { display: none; }
            .sidebar-header { display: none; }
            .cat-pill { flex-shrink: 0; width: auto; margin-bottom: 0; padding: 6px 12px; font-size: 11px; border-radius: 20px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .card-img-wrapper, .card img { height: 120px; }
        }
    </style>

<body>

    <div id="iosInstallBanner">
        <span>📲 To install Empire Catalog on your iPhone: Tap <b>Share</b> <span style="font-size: 14px;">⎋</span> & select <b>"Add to Home Screen"</b> <span style="font-size: 13px;">➕</span></span>
        <span onclick="closeIosBanner()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 16px; cursor: pointer; color: #94a3b8; padding: 2px 6px;">&times;</span>
    </div>

    <div class="diwali-banner">
        <span>✨</span> <b>EMPIRE GLASSWARE — Diwali Special 200+ Collection Catalog</b> <span>✨</span>
    </div>

    <header>
        <div class="header-title">
            <h1>EMPIRE GLASSWARE</h1>
            <p>Diwali Exclusive Full Catalog</p>
        </div>
        <div class="header-actions">
            <button id="pwaInstallBtn" style="display: none;" class="header-action-btn" onclick="installPWA()">
                📲 <span>Install</span>
            </button>
            <a href="index.html" class="header-action-btn"><i class="fa-solid fa-arrow-left"></i> Main</a>
        </div>
    </header>

    <div class="catalog-container">
        <aside class="sidebar" id="categorySidebar">
            <div class="sidebar-header">Diwali Categories</div>
            <button class="cat-pill active" onclick="filterFolder('ALL', this)">All Collections <span id="countAll" style="font-size:9.5px; opacity:0.8;"></span></button>
        </aside>

        <main class="main-content">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search product code (e.g. SMP021)..." oninput="searchProducts()">
            </div>
            <div class="grid" id="diwaliGrid"></div>
        </main>
    </div>

    <div class="floating-bottom-bar">
        <div class="selection-info" id="selectionSummary">0 Items Selected</div>
        <button class="btn-send-bulk" onclick="sendBulkOrderWhatsApp()">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Reserve Order on WhatsApp
        </button>
    </div>

    <div id="lightboxModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.95); z-index:1000; justify-content:center; align-items:center;" onclick="closeLightbox()">
        <span style="position:absolute; top:18px; right:22px; color:#fff; font-size:28px; cursor:pointer;">&times;</span>
        <img id="lightboxImg" src="" alt="Lightbox View">
    </div>

    <script>
        let diwaliData = {};
        let currentFolder = 'ALL';
        let selectedQuantities = {};
        const WHATSAPP_NUMBER = "9601693938";

        // Target Date: 21st September 2026, 11:00 AM IST
        const TARGET_TIME = new Date("2026-09-21T11:00:00+05:30").getTime();
        let timerInterval = null;

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaInstallBtn').style.display = 'flex';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    document.getElementById('pwaInstallBtn').style.display = 'none';
                });
            }
        }

        function closeIosBanner() {
            document.getElementById('iosInstallBanner').style.display = 'none';
        }
        const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);
        if (isIos && !isInStandaloneMode) {
            document.getElementById('iosInstallBanner').style.display = 'block';
        }

        // Left Swipe Gesture (Lightbox safe close)
        let touchstartX = 0;
        let touchendX = 0;

        document.addEventListener('touchstart', e => { 
            touchstartX = e.changedTouches[0].screenX; 
        }, false);

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchstartX - touchendX > 80) { 
                const lightbox = document.getElementById('lightboxModal');
                if (lightbox && lightbox.style.display === 'flex') {
                    closeLightbox(); 
                }
            }
        }, false);

        fetch('diwali-categories.json')
            .then(res => res.json())
            .then(data => {
                diwaliData = data;
                buildSidebar();
                renderGrid('ALL');
                startGlobalTimer();
            })
            .catch(err => {
                console.error('Error loading JSON:', err);
                document.getElementById('diwaliGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#dc2626; font-size:12px;">Please make sure server is running and diwali-categories.json is available.</div>';
            });

        function buildSidebar() {
            const sidebar = document.getElementById('categorySidebar');
            let totalCount = 0;
            Object.keys(diwaliData).forEach(folder => {
                totalCount += diwaliData[folder].length;
                const btn = document.createElement('button');
                btn.className = 'cat-pill';
                btn.innerHTML = `<span>${folder}</span> <span style="font-size:9.5px; opacity:0.7;">(${diwaliData[folder].length})</span>`;
                btn.onclick = () => filterFolder(folder, btn);
                sidebar.appendChild(btn);
            });
            document.getElementById('countAll').innerText = `(${totalCount})`;
        }

        function filterFolder(folder, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            currentFolder = folder;
            renderGrid(folder);
        }

        function renderGrid(folder, searchQuery = '') {
            const grid = document.getElementById('diwaliGrid');
            grid.innerHTML = '';

            let itemsToDisplay = [];
            if (folder === 'ALL') {
                Object.keys(diwaliData).forEach(f => {
                    itemsToDisplay = itemsToDisplay.concat(diwaliData[f]);
                });
            } else {
                itemsToDisplay = diwaliData[folder] || [];
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                itemsToDisplay = itemsToDisplay.filter(p => p.code.toLowerCase().includes(q));
            }

            if (itemsToDisplay.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:30px; color:#64748b; font-size:12px;">No items found.</div>';
                return;
            }

            itemsToDisplay.forEach(p => {
                const imgPath = `images/DIWALI_ITEMS/${p.image}`;
                const currentQty = selectedQuantities[p.code] || 0;
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-wrapper">
                            <img src="${imgPath}" alt="${p.code}" onclick="openLightbox('${imgPath}')" onerror="this.src='images/logo.jpeg'">
                        </div>
                        <div class="countdown-badge" id="timer-${p.code}">⏳ Calculating...</div>
                        <div class="p-code">${p.code}</div>
                        <div class="counter-row">
                            <span class="counter-label">CTN:</span>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty('${p.code}', -1)">-</button>
                                <span class="qty-val" id="qty-${p.code}">${currentQty}</span>
                                <button class="qty-btn" onclick="updateQty('${p.code}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            updateAllTimers();
        }

        function startGlobalTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateAllTimers, 1000);
        }

        function updateAllTimers() {
            const now = new Date().getTime();
            const distance = TARGET_TIME - now;

            const timerElements = document.querySelectorAll('[id^="timer-"]');
            timerElements.forEach(el => {
                if (distance < 0) {
                    el.innerText = "🟢 Available Now";
                    el.style.color = "#16a34a";
                    el.style.background = "#f0fdf4";
                    el.style.borderColor = "#bbf7d0";
                } else {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    el.innerText = `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s`;
                }
            });
        }

        function updateQty(code, change) {
            let qty = selectedQuantities[code] || 0;
            qty += change;
            if (qty < 0) qty = 0;

            if (qty === 0) {
                delete selectedQuantities[code];
            } else {
                selectedQuantities[code] = qty;
            }

            const qtyElem = document.getElementById(`qty-${code}`);
            if (qtyElem) qtyElem.innerText = qty;

            updateSelectionSummary();
        }

        function updateSelectionSummary() {
            let totalItems = Object.keys(selectedQuantities).length;
            let totalCtns = Object.values(selectedQuantities).reduce((a, b) => a + b, 0);
            document.getElementById('selectionSummary').innerText = `${totalItems} Items (${totalCtns} CTN) Selected`;
        }

        function searchProducts() {
            const q = document.getElementById('searchInput').value;
            renderGrid(currentFolder, q);
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        function sendBulkOrderWhatsApp() {
            const keys = Object.keys(selectedQuantities);
            if (keys.length === 0) {
                alert("Please select at least 1 item and carton quantity using (+ / -) buttons.");
                return;
            }

            let msg = "*🛍️ DIWALI CATALOG - BULK ORDER RESERVATION*\n";
            msg += "-----------------------------------------\n";

            keys.forEach((code, index) => {
                const ctn = selectedQuantities[code];
                msg += `${index + 1}. *Code: ${code}* — *${ctn} CTN*\n`;
            });

            msg += "-----------------------------------------\n";
            msg += "Hello Empire Glassware, please confirm availability and wholesale rates for these selected items.";

            const url = `https://wa.me/91${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
